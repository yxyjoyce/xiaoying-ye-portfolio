<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact | Xiaoying Ye</title>
    <link rel="stylesheet" href="../styles/site.css?v=20260831-2">
  </head>
  <body data-page="contact" data-root="..">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="site-nav" aria-label="Primary navigation">
        <a data-nav="home" href="../index.html">Home</a>
        <a data-nav="additional" href="../additional-works/index.html">Additional Works</a>
        <a data-nav="contact" href="../contact/index.html">Contact</a>
      </nav>
    </header>

    <main id="main">
      <section class="page-hero contact-page-hero" aria-labelledby="contact-title">
        <h1 class="page-title" id="contact-title">CONTACT</h1>
        <p class="contact-lede">If you have any questions about me, or just want to say hello, feel free to contact me. Below are my phone number and email address.</p>

        <div class="contact-columns">
          <section class="contact-block" aria-labelledby="contact-info-title">
            <h2 id="contact-info-title">联系方式</h2>
            <div class="contact-links">
              <a class="contact-link" href="tel:15000957508" aria-label="电话 15000957508">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.3 3.8 9.7 3a1.4 1.4 0 0 1 1.7.8l1.1 2.8a1.4 1.4 0 0 1-.4 1.6l-1.5 1.2a12.4 12.4 0 0 0 4.2 4.2l1.2-1.5a1.4 1.4 0 0 1 1.6-.4l2.8 1.1a1.4 1.4 0 0 1 .8 1.7l-.8 2.4a2.2 2.2 0 0 1-2.3 1.5C10.8 17.7 6.3 13.2 4.6 7.1a2.2 2.2 0 0 1 1.5-2.3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                <span>15000957508</span>
              </a>
              <a class="contact-link" href="mailto:yxyjoyce@qq.com" aria-label="邮箱 yxyjoyce@qq.com">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.3" y="5.3" width="17.4" height="13.4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m4.2 6.7 7.8 6 7.8-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>yxyjoyce@qq.com</span>
              </a>
            </div>
          </section>

          <section class="contact-block" aria-labelledby="message-title">
            <h2 id="message-title">留言</h2>
            <form class="contact-form" data-contact-form data-recipient="yxyjoyce@qq.com" novalidate>
              <label class="sr-only" for="contact-name">Name</label>
              <input id="contact-name" name="name" type="text" placeholder="Name" autocomplete="name" required>
              <label class="sr-only" for="contact-email">Email</label>
              <input id="contact-email" name="email" type="email" placeholder="Email" autocomplete="email" required>
              <label class="sr-only" for="contact-subject">Subject</label>
              <input id="contact-subject" name="subject" type="text" placeholder="Subject" required>
              <label class="sr-only" for="contact-message">Message</label>
              <textarea id="contact-message" name="message" placeholder="Message" required></textarea>
              <button class="form-submit" type="submit">Submit</button>
              <p class="form-status" data-form-status hidden role="status"></p>
            </form>
          </section>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2021 by Xiaoying Ye.</p>
    </footer>

    <script src="../scripts/site.js"></script>
  </body>
</html>
